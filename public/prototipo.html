<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FieldPoint">
<title>FieldPoint · Prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1F44;--org:#F15A24;--ok:#2E7D4F;--err:#C0392B;--bg:#F4F6FA;--card:#fff;--tx:#0A1F44;--mut:#5A6478;--line:#DDE2EA;--use:#0A1F44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071433;--card:#0F2552;--tx:#fff;--mut:#D9D9D9;--line:#28427C;--use:#2B4FA3}}
:root[data-theme="dark"]{--bg:#071433;--card:#0F2552;--tx:#fff;--mut:#D9D9D9;--line:#28427C;--use:#2B4FA3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/24px "Open Sans",Arial,sans-serif}
h1,h2,h3,button,.nav a{font-family:Montserrat,Arial,sans-serif}
h1{font-size:26px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0}
[hidden]{display:none!important}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(10,31,68,.10)}
.btn{border:0;border-radius:16px;min-height:48px;padding:0 20px;font-weight:600;font-size:16px;cursor:pointer;background:var(--org);color:var(--navy)}
.btn.s{background:var(--navy);color:#fff}.btn.o{background:transparent;color:var(--tx);border:2px solid var(--tx)}.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn:disabled{background:#D9D9D9;color:#666;cursor:not-allowed}
input,select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:16px "Open Sans",Arial,sans-serif;background:var(--card);color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--org)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.chip{display:inline-block;border-radius:23px;padding:2px 12px;font:600 13px Montserrat,Arial,sans-serif;background:var(--ok);color:#fff}
.chip.r{background:var(--org);color:var(--navy)}.chip.u{background:var(--use)}.chip.e{background:var(--err)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
#login .card{width:100%;max-width:420px;text-align:center}#login img{width:280px;max-width:100%}
.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--navy);padding:24px 16px;display:none;flex-direction:column;gap:6px}
.side img{width:170px;margin:0 0 20px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#D9D9D9;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
.nav a.on{background:var(--org);color:var(--navy)}.nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:flex-start;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.bot a{flex:none;min-width:78px;flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;text-align:center}
main{padding:20px 16px 110px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{display:block;font:700 26px Montserrat,Arial,sans-serif;color:var(--org)}.kpi span{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.mesa{cursor:pointer;border:3px solid transparent}.mesa.on{border-color:var(--org)}.mesa p{margin:4px 0 8px;color:var(--mut);font-size:14px}
.q{display:flex;align-items:center;gap:10px}.q button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.prods{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
table{width:100%;border-collapse:collapse}th{background:var(--navy);color:#fff;text-align:left;padding:10px;font:600 14px Montserrat,Arial,sans-serif}td{padding:10px;border-bottom:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;margin-top:12px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bars i{display:block;background:var(--navy);border-radius:10px 10px 0 0;margin-bottom:4px}.bars .h i{background:var(--org)}
.mo{position:fixed;inset:0;background:rgba(10,31,68,.6);display:grid;place-items:center;padding:16px;z-index:9}.mo .card{width:100%;max-width:440px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:16px;z-index:10;font-size:14px;max-width:90%}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:24px}
.kpi b{font-size:clamp(20px,5.6vw,26px);white-space:nowrap}td{white-space:nowrap}td,th{padding:10px 8px}
.split{display:block}.split .dt{margin-top:16px}
@media(min-width:640px){main{padding:24px 28px 120px}.bot{justify-content:center}.bot a{min-width:82px;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.split .dt{margin-top:0}h1{font-size:30px}}
@media(min-width:900px){.side{display:flex}.bot{display:none}main{margin-left:230px;padding-bottom:40px}#toast{bottom:30px}}
</style></head><body>

<script>

res(){return `<div class="card"><h2>Cancha sintética · Hoy</h2>${H.map(h=>{const n=S.res[h];return `<div class="row"><span><b>${h}:00 – ${h+1}:00</b>${n?' · '+n:''}</span><span>${n?`<span class="chip ${h==S.uso?'u':'r'}">${h==S.uso?'En uso':'Reservada'}</span> ${h==S.uso?'':`<button class="btn sm o" onclick="unres(${h})">Cancelar</button>`}`:`<span class="chip">Disponible</span> <button class="btn sm" onclick="askres(${h})">Reservar</button>`}</span></div>`}).join('')}</div>`},
cue(){const s=S.sel,a=s&&S.acc[s];return `<div class="split"><div class="grid">${Object.keys(S.acc).map(k=>{const t=tot(S.acc[k]);return `<div class="card mesa ${k==s?'on':''}" onclick="sel('${k}')"><h3>${k}</h3><p>${t?m$(t):'Sin consumo'}</p><span class="chip ${t?'r':''}">${t?'Abierta':'Libre'}</span></div>`}).join('')}</div>
${a?`<div class="card dt"><h2>${s}</h2>${Object.entries(a).filter(e=>e[1]>0).map(([i,q])=>`<div class="row"><span>${pr(i).n} · ${m$(ef(pr(i)))}</span><span class="q"><button onclick="chg('${i}',-1)" aria-label="Quitar">−</button><b>${q}</b><button onclick="chg('${i}',1)" aria-label="Agregar">+</button></span></div>`).join('')||'<p style="color:var(--mut)">Agrega productos para abrir la cuenta.</p>'}
<div class="prods">${P.map(p=>`<button class="btn sm s" onclick="chg('${p.id}',1)">+ ${p.n}</button>`).join('')}</div>
<div class="row"><h3>Total</h3><b style="font:700 24px Montserrat;color:var(--org)">${m$(tot(a))}</b></div><button class="btn" style="width:100%" ${tot(a)?'':'disabled'} onclick="pay()">Cobrar cuenta</button></div>`:'<p class="note">Selecciona una mesa para ver su consumo individual.</p>'}</div>`},
inv(){return `<div class="card" style="overflow-x:auto"><table><tr><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th></th></tr>${P.map(p=>`<tr><td>${p.n}</td><td>${p.s}</td><td>${p.m}</td><td><span class="chip ${p.s<=p.m?'e':''}">${p.s<=p.m?'Stock bajo':'Correcto'}</span></td><td><button class="btn sm o" onclick="ent('${p.id}')">+10 entrada</button></td></tr>`).join('')}</table></div>`},
rep(){const w=[['Lun',132000],['Mar',148000],['Mié',121000],['Jue',167000],['Vie',210000],['Sáb',246000],['Hoy',ven()]],mx=Math.max(...w.map(x=>x[1]));return `<div class="grid"><div class="card kpi"><b>${m$(ven())}</b><span>Ventas de hoy</span></div><div class="card kpi"><b>${S.cer}</b><span>Cuentas cerradas</span></div><div class="card kpi"><b>${m$(Object.keys(S.res).length*PRECIO)}</b><span>Alquiler de cancha</span></div><div class="card kpi"><b>${m$(ven()+Object.keys(S.res).length*PRECIO-eg())}</b><span>Utilidad estimada</span></div></div>
<div class="card" style="margin-top:16px"><h2>Ventas de la semana</h2><div class="bars">${w.map(([d,v])=>`<div class="${d=='Hoy'?'h':''}"><i style="height:${Math.round(v/mx*160)}px"></i>${d}<br>${Math.round(v/1000)}k</div>`).join('')}</div><button class="btn sm o" style="margin-top:16px" onclick="toast('Reporte mensual exportado (simulado)')">Exportar cierre mensual</button></div>`}};
function askres(h){modal(`<h2>Reservar ${h}:00 – ${h+1}:00</h2><label for="cl">Nombre del cliente o equipo</label><input id="cl" placeholder="Ej. Los Tigres"><div class="row"><span>Valor de la hora</span><b>${m$(PRECIO)}</b></div><div style="display:flex;gap:10px"><button class="btn o" onclick="close()">Cancelar</button><button class="btn" style="flex:1" onclick="doRes(${h})">Confirmar reserva</button></div>`);$('#cl').focus()}
function doRes(h){S.res[h]=$('#cl').value.trim()||'Cliente';close();toast('Reserva confirmada');show('res')}
function unres(h){delete S.res[h];toast('Reserva cancelada');show('res')}
function sel(k){S.sel=k;show('cue')}
function chg(i,d){const a=S.acc[S.sel],q=(a[i]||0)+d;if(d>0&&q>pr(i).s)return toast('Sin existencias de '+pr(i).n);a[i]=Math.max(q,0);show('cue')}
function pay(){const t=tot(S.acc[S.sel]);modal(`<h2>Cobrar · ${S.sel}</h2><div class="row"><span>Total</span><b>${m$(t)}</b></div><label for="me">Método de pago</label><select id="me"><option>Efectivo</option><option>Transferencia</option></select><label for="np">Dividir entre (personas)</label><input id="np" type="number" min="1" value="1" oninput="$('#pp').textContent=m$(Math.ceil(${t}/Math.max(1,this.value)))"><div class="row"><span>Cada persona paga</span><b id="pp">${m$(t)}</b></div><div style="display:flex;gap:10px"><button class="btn o" onclick="close()">Volver</button><button class="btn" style="flex:1" onclick="ok()">Confirmar pago</button></div>`)}
function ok(){const a=S.acc[S.sel],t=tot(a);S[$('#me').value=='Efectivo'?'efe':'tra']+=t;S.sold+=t;S.cer++;Object.entries(a).forEach(([i,q])=>pr(i).s-=q);S.acc[S.sel]={};close();toast('Cuenta cerrada · comprobante generado');show('cue')}
function ent(i){pr(i).s+=10;toast('Entrada registrada: '+pr(i).n);show('inv')}
P.forEach((p,i)=>p.c=[2500,1200,3200,2000,1500,2600][i]);
Object.assign(S,{efe:120500,tra:64000,cerrada:false,eg:[{c:'Servicio de energía',m:45000},{c:'Aseo y mantenimiento',m:30000}],
prom:[{n:'Combo tarde: 20 % en papas',pid:'pap',pc:20,on:true},{n:'Gaseosa con 10 % de descuento',pid:'gas',pc:10,on:false}],
prov:[{n:'Distribuidora Huila',t:'310 555 0101'},{n:'Bebidas del Sur',t:'311 555 0202'}],comp:[{d:'28 sep',p:'Distribuidora Huila',t:'Cerveza ×24',m:76800}],
usr:[{n:'Administrador general',r:'Administrador',on:true},{n:'Operador turno tarde',r:'Operador',on:true},{n:'Operador turno noche',r:'Operador',on:false}]});
const ef=p=>{const q=S.prom.find(x=>x.on&&x.pid==p.id);return q?Math.round(p.p*(1-q.pc/100)):p.p},g=i=>$('#'+i).value,eg=()=>S.eg.reduce((s,x)=>s+x.m,0),G2='style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"';
const hd=(t,b)=>`<div class="row"><h2 style="margin:0">${t}</h2>${b}</div>`;
function frm(t,f,fn){modal(`<h2>${t}</h2>${f.map(([i,l,ty,v])=>`<label for="${i}">${l}</label>${ty=='sel'?`<select id="${i}">${v.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${i}" type="${ty}" value="${v??''}">`}`).join('')}<div style="display:flex;gap:10px;margin-top:16px"><button class="btn o" onclick="close()">Cancelar</button><button class="btn" style="flex:1" onclick="${fn}">Guardar</button></div>`)}
const done=(m,v)=>{close();toast(m);show(v)},byN=n=>P.find(p=>p.n==g(n));
Object.assign(V,{
pro(){return `<div class="card" style="overflow-x:auto">${hd('Catálogo','<button class="btn sm" onclick="np()">+ Nuevo producto</button>')}<table><tr><th>Producto</th><th>Precio</th><th>Costo</th><th>Margen</th><th></th></tr>${P.map(p=>`<tr><td>${p.n}</td><td>${m$(ef(p))}${ef(p)<p.p?' <span class="chip r">Promo</span>':''}</td><td>${m$(p.c)}</td><td>${Math.round((ef(p)-p.c)/ef(p)*100)} %</td><td><button class="btn sm o" onclick="ep('${p.id}')">Editar</button></td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:16px">${hd('Promociones','<button class="btn sm" onclick="npm()">+ Nueva promoción</button>')}${S.prom.map((x,i)=>`<div class="row"><span>${x.n}</span><button class="btn sm ${x.on?'':'o'}" onclick="S.prom[${i}].on=!S.prom[${i}].on;show('pro')">${x.on?'Activa':'Inactiva'}</button></div>`).join('')}</div>`},
com(){return `<div class="grid" ${G2}><div class="card">${hd('Proveedores','<button class="btn sm o" onclick="npv()">+ Proveedor</button>')}${S.prov.map(x=>`<div class="row"><span>${x.n}</span><span style="color:var(--mut)">${x.t}</span></div>`).join('')}</div>
<div class="card">${hd('Compras','<button class="btn sm" onclick="nc()">+ Registrar compra</button>')}${S.comp.map(x=>`<div class="row"><span>${x.d} · ${x.p}<br><small style="color:var(--mut)">${x.t}</small></span><b>${m$(x.m)}</b></div>`).join('')}</div></div>`},
caj(){const ing=ven()+Object.keys(S.res).length*PRECIO;return `<div class="grid"><div class="card kpi"><b>${m$(ing)}</b><span>Ingresos</span></div><div class="card kpi"><b>${m$(eg())}</b><span>Egresos</span></div><div class="card kpi"><b>${m$(ing-eg())}</b><span>Utilidad del día</span></div></div>
<div class="grid" ${G2}><div class="card">${hd('Egresos','<button class="btn sm o" onclick="ne()">+ Egreso</button>')}${S.eg.map(x=>`<div class="row"><span>${x.c}</span><b>${m$(x.m)}</b></div>`).join('')}</div>
<div class="card"><h2>Cierre de caja</h2><div class="row"><span>Efectivo</span><b>${m$(S.efe)}</b></div><div class="row"><span>Transferencias</span><b>${m$(S.tra)}</b></div><div class="row"><span>Estado</span><span class="chip ${S.cerrada?'':'r'}">${S.cerrada?'Caja cerrada':'Abierta'}</span></div><button class="btn" style="width:100%;margin-top:12px" ${S.cerrada?'disabled':''} onclick="cc()">Cerrar caja del día</button></div></div>`},
usu(){return `<div class="card" style="overflow-x:auto">${hd('Usuarios y roles','<button class="btn sm" onclick="nu()">+ Nuevo usuario</button>')}<table><tr><th>Nombre</th><th>Rol</th><th>Estado</th></tr>${S.usr.map((u,i)=>`<tr><td>${u.n}</td><td>${u.r}</td><td><button class="btn sm ${u.on?'':'o'}" onclick="S.usr[${i}].on=!S.usr[${i}].on;show('usu')">${u.on?'Activo':'Inactivo'}</button></td></tr>`).join('')}</table></div><p class="note">Administrador: acceso total. Operador: reservas, cuentas, inventario y caja.</p>`}});
function np(){frm('Nuevo producto',[['a','Nombre','text'],['b','Precio de venta','number'],['c','Costo','number'],['d','Stock inicial','number',0],['e','Stock mínimo','number',5]],'addp()')}
function addp(){if(!g('a').trim())return toast('Escribe el nombre del producto');P.push({id:'p'+Date.now(),n:g('a').trim(),p:+g('b')||0,c:+g('c')||0,s:+g('d')||0,m:+g('e')||0});done('Producto creado','pro')}
function ep(i){const p=pr(i);frm('Editar '+p.n,[['b','Precio de venta','number',p.p],['c','Costo','number',p.c]],`savep('${i}')`)}
function savep(i){const p=pr(i);p.p=+g('b')||p.p;p.c=+g('c')||p.c;done('Producto actualizado','pro')}
function npm(){frm('Nueva promoción',[['a','Nombre','text'],['b','Producto','sel',P.map(p=>p.n)],['c','Descuento (%)','number',10]],'addpm()')}
function addpm(){S.prom.push({n:g('a').trim()||'Promoción',pid:byN('b').id,pc:Math.min(90,+g('c')||0),on:true});done('Promoción creada','pro')}
function npv(){frm('Nuevo proveedor',[['a','Nombre','text'],['b','Teléfono','tel']],'addpv()')}
function addpv(){if(!g('a').trim())return toast('Escribe el nombre');S.prov.push({n:g('a').trim(),t:g('b')||'Sin teléfono'});done('Proveedor agregado','com')}
function nc(){frm('Registrar compra',[['a','Proveedor','sel',S.prov.map(x=>x.n)],['b','Producto','sel',P.map(p=>p.n)],['c','Cantidad','number',10],['d','Costo unitario','number','']],'addc()')}
function addc(){const p=byN('b'),q=+g('c')||0,u=+g('d')||p.c;if(q<1)return toast('Indica la cantidad');p.s+=q;p.c=u;S.comp.unshift({d:'Hoy',p:g('a'),t:p.n+' ×'+q,m:q*u});S.eg.push({c:'Compra: '+p.n,m:q*u});done('Compra registrada · inventario actualizado','com')}
function ne(){frm('Registrar egreso',[['a','Concepto','text'],['b','Monto','number']],'adde()')}
function adde(){if(!g('a').trim()||!+g('b'))return toast('Completa concepto y monto');S.eg.push({c:g('a').trim(),m:+g('b')});done('Egreso registrado','caj')}
function cc(){modal(`<h2>Cerrar caja del día</h2><div class="row"><span>Efectivo esperado</span><b>${m$(S.efe)}</b></div><label for="ct">Efectivo contado</label><input id="ct" type="number" value="${S.efe}" oninput="$('#df').textContent=m$(this.value-${S.efe})"><div class="row"><span>Diferencia</span><b id="df">${m$(0)}</b></div><div style="display:flex;gap:10px"><button class="btn o" onclick="close()">Volver</button><button class="btn" style="flex:1" onclick="S.cerrada=true;done('Caja cerrada · reporte del día generado','caj')">Confirmar cierre</button></div>`)}
function nu(){frm('Nuevo usuario',[['a','Nombre','text'],['b','Rol','sel',['Operador','Administrador']]],'addu()')}
function addu(){if(!g('a').trim())return toast('Escribe el nombre');S.usr.push({n:g('a').trim(),r:g('b'),on:true});done('Usuario creado','usu')}
$('#mo').addEventListener('click',e=>{if(e.target.id=='mo')close()});
</script></body></html>

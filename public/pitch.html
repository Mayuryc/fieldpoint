<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44"><title>FieldPoint · Presentación</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0A1F44;color:#fff;font-family:'Open Sans',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
header{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
header img{height:44px}
.wrap{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
video{width:100%;height:100%;display:block;background:#000}
.snd{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);background:#F15A24;color:#fff;border:0;border-radius:999px;padding:14px 26px;font:700 16px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.snd[hidden]{display:none}
.acc{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{background:#F15A24;color:#fff;text-decoration:none;font:700 17px Arial,sans-serif;padding:14px 28px;border-radius:999px}
a.btn.o{background:transparent;border:2px solid #fff}
p{max-width:760px;text-align:center;color:#C8D4EB;margin:14px 0 0;line-height:1.5}
</style></head><body>
<header><img src="assets/logo-h.png" alt="FieldPoint · Football Business & Management Platform"><span>Grupo 7 · Politécnico Grancolombiano</span></header>
<div class="wrap">
<video id="v" src="assets/fieldpoint-pitch.mp4" autoplay muted playsinline controls preload="auto" poster="assets/pitch-poster.jpg"></video>
<button class="snd" id="snd" type="button">Activar sonido</button>
</div>
<div class="acc"><a class="btn" id="go" href="sistema.html">Ingresar al sistema</a><a class="btn o" href="prototipo.html">Ver prototipo de interfaz</a></div>
<p>Presentación de FieldPoint (3 minutos). Si el video no inicia solo, presione reproducir; para escuchar la narración, active el sonido.</p>
<script>
var v=document.getElementById('v'),b=document.getElementById('snd');
v.play&&v.play().catch(function(){});
b.onclick=function(){v.muted=false;v.currentTime=0;v.play();b.hidden=true};
v.addEventListener('volumechange',function(){if(!v.muted)b.hidden=true});
</script></body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44"><title>FieldPoint · Sistema</title>
<link rel="icon" type="image/png" href="assets/icon.png"><link rel="stylesheet" href="theme.css">
</head><body>
<div id="login"><form class="card" id="lf" data-testid="login-form"><img src="assets/logo-h.png" alt="FieldPoint · Football Business & Management Platform"><p>Ingrese para gestionar el negocio.</p>
<label for="correo">Correo</label><input id="correo" type="email" value="admin@fieldpoint.co" required data-testid="correo" autocomplete="username">
<label for="pw">Contraseña</label><input id="pw" type="password" required data-testid="password" autocomplete="current-password">
<div class="err" id="lerr" role="alert" data-testid="login-error"></div><button class="btn" data-testid="login-submit">Ingresar</button>
<p class="note" style="margin-top:14px"><a href="prototipo.html">Ver prototipo de interfaz</a></p></form></div>
<div id="app" hidden>
<aside class="side"><img class="brand" src="assets/logo-side.png" alt="FieldPoint"><nav id="tabs" class="nav" aria-label="Módulos"></nav></aside>
<header class="topbar"><img class="mini" src="assets/icon.png" alt=""><h1 id="ttl"></h1><div class="user"><span id="who" data-testid="usuario"></span><button class="btn sm o" id="out" data-testid="logout">Salir</button></div></header>
<main><div id="alerta"></div>
<div class="bar" id="barra" hidden><input id="q" placeholder="Buscar por nombre…" data-testid="buscar" aria-label="Buscar"><button class="btn" id="new" data-testid="nuevo">+ Nuevo</button></div>
<div id="view" hidden></div>
<div id="crud" hidden><div class="card scroll"><table><thead id="th"></thead><tbody id="tb" data-testid="tabla"></tbody></table><p id="cnt" class="note" style="text-align:left;margin:12px 0 0"></p></div></div></main></div>
<div class="mo" id="mo" hidden><form class="card" id="mf" data-testid="form"></form></div><div id="toast" hidden role="status" aria-live="polite"></div>
<script src="app.js"></script></body></html>
